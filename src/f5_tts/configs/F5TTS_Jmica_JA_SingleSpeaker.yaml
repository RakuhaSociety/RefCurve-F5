hydra:
  run:
    dir: ckpts/${model.name}_${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  # CustomDatasetPath 直接读取该目录下的 raw.arrow / duration.json。
  name: data/JmicaSingleSpeaker_custom
  dataset_type: CustomDatasetPath
  batch_size_per_gpu: 3200
  batch_size_type: frame
  max_samples: 8
  num_workers: 8

optim:
  # 数据规模确认后，按 updates/epoch 覆盖 epochs；这里仅是安全上限。
  epochs: 100
  max_updates: null
  learning_rate: 1e-5
  num_warmup_updates: 100
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: F5TTS_Jmica_JA_SingleSpeaker
  tokenizer: custom
  tokenizer_path: ckpts/F5TTS_JA_Jmica/vocab_japanese.txt
  backbone: DiT
  # Jmica 使用旧版 F5TTS_Base，而非 F5TTS_v1_Base。
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: False
    conv_layers: 4
    pe_attn_head: 1
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: False
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: True
    local_path: ckpts/vocos-mel-24khz

ckpts:
  logger: null
  wandb_project: RefCurve-F5-JA
  wandb_run_name: ${model.name}
  wandb_resume_id: null
  log_samples: False
  save_per_updates: 500
  keep_last_n_checkpoints: 5
  last_per_updates: 100
  save_dir: ckpts/${model.name}
  # 仅在 save_dir 内没有 model_*.pt / model_last.pt 时使用；正常恢复始终优先。
  pretrained_init: ckpts/F5TTS_JA_Jmica/model_21999120.pt
